<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Base head tags. Per-page title / description / OG / JSON-LD are injected
      by react-helmet-async via <SEO> in src/components/ui.jsx.
    -->
    <title>Brand Name — Future-ready skills for young learners</title>
    <meta name="description" content="Live, small-batch online classes in coding, communication and creative thinking for ages 8–16. Book a free demo class at Brand Name." />
    <meta name="theme-color" content="#7B4FD8" />
    <meta property="og:image" content="https://images.pexels.com/photos/8472789/pexels-photo-8472789.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=630&w=1200" />
    <!-- Inline SVG favicon so the single-file build needs no extra asset -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 46 30'%3E%3Ccircle cx='14' cy='15' r='12.3' fill='%237B4FD8'/%3E%3Ccircle cx='30' cy='15' r='12.3' fill='%23FF6B0A'/%3E%3C/svg%3E" />
    <!-- Fonts: Fraunces (warm calligraphic serif) + Plus Jakarta Sans (UI). display=swap for fast first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
